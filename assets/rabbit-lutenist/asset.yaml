# descriptive: find it and understand it
id: rabbit-lutenist
title: Rabbit playing a lute among ivy
description: A brown rabbit with a cream chest and belly stands upright on its hind legs in profile facing right and plays a red lute with a gilt rose, long ears raised, one paw on the neck and the other over the strings. Beneath it a green ivy vine with gold leaves and tendrils curls across the ground to both sides. Painted in the manner of a manuscript miniature with fine white fur strokes and gold details, on a transparent background.
