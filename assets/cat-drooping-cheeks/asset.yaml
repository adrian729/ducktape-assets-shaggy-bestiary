title: Reclining brown cat with drooping cheeks
description: A long, reclining brown and cream cat-like creature rests on its
  forepaws and looks at the viewer with a sagging human face, drooping cheeks,
  uneven heavy-lidded eyes, a long closed mouth and pale whiskers parted over a
